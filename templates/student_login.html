<!DOCTYPE html>
<html>

<head>

    <title>Student Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body class="login-page">

<div class="login-box student-login-box">

    <div class="role-icon">
        👨‍🎓
    </div>

    <h2>Student Login</h2>

    <p class="login-subtitle">
        Login using your College ID
    </p>

    {% if error %}

    <div class="error-message">
        ⚠️ {{ error }}
    </div>

    {% endif %}

    <form method="POST">

        <input
            type="text"
            name="college_id"
            placeholder="Enter College ID"
            maxlength="9"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Enter Password"
            required
        >

        <button type="submit">
            Login →
        </button>

    </form>

    <div class="register-section">

        <p>
            New Student?
        </p>

        <a href="/student-register"
           class="register-link">

            🎓 Register Now

        </a>

    </div>

    <p class="back-login">

        <a href="/">
            ← Back to Login Selection
        </a>

    </p>

</div>

</body>

</html>
