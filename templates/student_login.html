<!DOCTYPE html>
<html>

<head>

    <title>Student Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body class="login-page">


<div class="login-box student-login-box">

    <div class="role-icon">
        👨‍🎓
    </div>

    <h2>Student Login</h2>

    <p class="login-subtitle">
        Login using your Student ERP ID
    </p>


    <form method="POST">


        <input
            type="text"
            name="erp_id"
            placeholder="Enter Student ERP ID"
            required
        >


        <input
            type="password"
            name="password"
            placeholder="Enter Password"
            required
        >


        <button type="submit">
            Login →
        </button>


    </form>


    <p class="back-login">

        <a href="/role-login">
            ← Back to Login Selection
        </a>

    </p>


</div>


</body>

</html>
