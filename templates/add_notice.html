<!DOCTYPE html>
<html>

<head>

    <title>Add Notice</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>

<div class="form-box">

    <h2>Add New Notice</h2>


    <form method="POST">


        <input
            type="text"
            name="title"
            placeholder="Notice Title"
            required
        >


        <select name="category" id="category" required>

            <option value="">
                Select Category
            </option>

            <option value="Examination">
                Examination
            </option>

            <option value="Event">
                Event
            </option>

            <option value="Academic">
                Academic
            </option>

            <option value="General">
                General
            </option>

        </select>


        <!-- Event Registration Link -->

        <div id="registration-section"
             style="display: none;">

            <input
                type="url"
                name="registration_link"
                id="registration_link"
                placeholder="Event Registration Link (https://...)"
            >

            <small>
                Add a registration link for this event.
            </small>

        </div>


        <input
            type="date"
            name="date"
            required
        >


        <textarea
            name="description"
            placeholder="Notice Description"
            required
        ></textarea>


        <label>

            <input
                type="checkbox"
                name="important"
            >

            Mark as Important

        </label>


        <button type="submit">
            Publish Notice
        </button>


    </form>

</div>


<script>

    const category =
        document.getElementById("category");

    const registrationSection =
        document.getElementById("registration-section");


    function toggleRegistration() {

        if (category.value === "Event") {

            registrationSection.style.display = "block";

        } else {

            registrationSection.style.display = "none";

        }

    }


    category.addEventListener(
        "change",
        toggleRegistration
    );


    toggleRegistration();

</script>


</body>

</html>
