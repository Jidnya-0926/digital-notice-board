<!DOCTYPE html>
<html>

<head>

    <title>Add Notice</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>

<div class="form-box">

    <h2>Add New Notice</h2>


    <form method="POST">


        <input
            type="text"
            name="title"
            placeholder="Notice Title"
            required
        >


        <select name="category" required>

            <option value="">
                Select Category
            </option>

            <option value="Examination">
                Examination
            </option>

            <option value="Event">
                Event
            </option>

            <option value="Academic">
                Academic
            </option>

            <option value="General">
                General
            </option>

        </select>


        <input
            type="date"
            name="date"
            required
        >


        <textarea
            name="description"
            placeholder="Notice Description"
            required
        ></textarea>


        <label>

            <input
                type="checkbox"
                name="important"
            >

            Mark as Important

        </label>


        <button type="submit">
            Publish Notice
        </button>


    </form>

</div>

</body>

</html>
